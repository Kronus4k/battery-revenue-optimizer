
# Battery Revenue Optimizer: raw landing files -> staging -> intermediate -> marts.
name: 'battery_dbt'
version: '1.0.0'

# Connection settings: profiles.yml in this folder (credentials from env vars).
profile: 'battery_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


models:
  battery_dbt:
    # Layered ELT: each folder becomes its own schema in the warehouse.
    # dbt prefixes it with the profile's schema -> analytics_staging, etc.
    staging:            # 1:1 with sources: rename, cast, parse quirks
      +schema: staging
      +materialized: view
    intermediate:       # joins and grain alignment (15-min -> hourly)
      +schema: intermediate
      +materialized: view
    marts:              # backtest results the Flask API reads
      +schema: marts
      +materialized: table
      # Read-only API login. dbt drops/recreates these tables on
      # every build (losing manual grants), and re-applies this after each build.
      # Only marts: staging/intermediate stay closed to api_reader.
      +grants:
        select: ['api_reader']


# Battery and backtest assumptions (README "Limitations" lists what they leave out).
vars:
  battery_power_mw: 1             # max charge/discharge power
  battery_energy_mwh: 2           # storage capacity -> 2 h at full power
  round_trip_efficiency: 0.85     # NREL ATB representative value; EIA fleet avg ~0.82