
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'battery_dbt'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'battery_dbt'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models


models:
  battery_dbt:
    # Layered ELT: each folder becomes its own schema in the warehouse.
    # dbt prefixes it with the profile's schema -> analytics_staging, etc.
    staging:            # 1:1 with sources: rename, cast, parse quirks
      +schema: staging
      +materialized: view
    intermediate:       # joins and grain alignment (15-min -> hourly)
      +schema: intermediate
      +materialized: view
    marts:              # backtest results Flask will read
      +schema: marts
      +materialized: table
      # Day 4 (D4.4): read-only API login. dbt drops/recreates these tables on
      # every build (losing manual grants), and re-applies this after each build.
      # Only marts: staging/intermediate stay closed to api_reader.
      +grants:
        select: ['api_reader']


# Battery and backtest assumptions (README "Simplifications"; Note 3.1).
vars:
  battery_power_mw: 1             # max charge/discharge power
  battery_energy_mwh: 2           # storage capacity -> 2 h at full power
  round_trip_efficiency: 0.85     # NREL ATB representative value; EIA fleet avg ~0.82