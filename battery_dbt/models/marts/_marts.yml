version: 2

models:
  - name: fct_reserve_daily
    description: >
      Strategy A reserve leg: revenue per zone, day and product (capacity payment only, 1 MW all day).
      Revenue sums the hours the source published; a missing hour earns 0 (conservative).
      n_hours < expected_hours shows such gaps (mFRR SE1 up since 2026-10-16).
    columns:
      - name: n_hours
        description: "Hours with a published price."
      - name: expected_hours
        description: "Hours in the local day: 24, or 23 / 25 on DST days."
        data_tests: [not_null]
      - name: reserve_revenue_eur
        data_tests: [not_null]

  - name: mart_strategy_daily
    description: >
      Strategy A result: revenue of each single-strategy choice per zone and day, and the winner.
      Perfect foresight; reserve side excludes activation energy and SoC rules. Not expected revenue.
    columns:
      - name: strategy
        data_tests:
          - accepted_values:
              arguments:
                values: ['arbitrage', 'fcr_n', 'fcr_d_up', 'fcr_d_down', 'mfrr_up', 'mfrr_down']
      - name: revenue_eur
        data_tests: [not_null]