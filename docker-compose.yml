# =============================================================================
# Battery Revenue Optimizer - local Airflow (Day 2, step 2.1) + warehouse (Day 3)
#
# What this runs:
#   postgres           -> Airflow's METADATA database (DAG runs, task states,
#                          retries). NOT our data; see "warehouse" below.
#   warehouse          -> OUR data warehouse (Day 3): dbt builds staging and
#                          marts here, Flask reads from here (Day 4).
#                          Separate server, user and volume from "postgres".
#   airflow-init       -> one-shot job: migrates the metadata DB, creates the
#                          admin login, then exits. Everything else waits for it.
#   airflow-apiserver  -> the UI + REST API on http://localhost:8080
#   airflow-scheduler  -> decides WHICH task runs WHEN, and runs it
#                          (LocalExecutor = tasks run as subprocesses here)
#   airflow-dag-processor -> parses files in ./dags into DAG objects
#
# Why LocalExecutor (not Celery like the official compose file)?
#   Celery needs Redis + worker containers: more RAM, more moving parts.
#   One laptop, a few tasks per day -> LocalExecutor is enough.
#   Interview line: "I chose the smallest executor that fits the workload."
# =============================================================================

# ---- Shared settings, reused by every Airflow service via YAML anchors ------
x-airflow-common: &airflow-common
  # Day 4: our own image = official Airflow 3.0.6 + dbt venv (Dockerfile, D4.1).
  # NEW name on purpose: with build + image, compose saves the built image
  # under this name; reusing "apache/airflow:3.0.6" would overwrite the
  # official image locally.
  build: .
  image: battery-airflow:3.0.6-dbt1.12.5
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Metadata DB connection: user:password@host:port/db
    # "postgres" is the service name below; Docker's network resolves it.
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    # Encrypts secrets stored in Airflow Connections. Comes from .env.
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    # Airflow 3: tasks talk to the scheduler through the API server.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # Airflow 3: all components must share the same token-signing secret.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    # Classic username/password login (FAB auth manager).
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    # New DAGs start PAUSED: nothing fires (e.g. a 90-day catch-up) by accident.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # No example DAGs cluttering the UI.
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Display times in our market's local time (storage stays UTC).
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Stockholm
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Europe/Stockholm
    # AWS credentials for invoking the Lambda (invoke-only user, see Note 2.4).
    # Values come from .env; boto3 reads these three names automatically.
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-north-1}
    # Day 4: warehouse access for the load_raw and dbt tasks.
    # Inside Docker the warehouse is service name + container port,
    # NOT 127.0.0.1:5433 (that port exists only on the Windows side).
    WAREHOUSE_HOST: warehouse
    WAREHOUSE_PORT: "5432"
    WAREHOUSE_USER: ${WAREHOUSE_USER}
    WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD}
    WAREHOUSE_DB: ${WAREHOUSE_DB:-battery}
    # dbt reads the profile from the mounted project, but writes ALL output
    # to /tmp, so the project can be mounted read-only (tested on dbt 1.12.5).
    DBT_PROFILES_DIR: /opt/airflow/battery_dbt
    DBT_TARGET_PATH: /tmp/dbt/target
    DBT_LOG_PATH: /tmp/dbt/logs
  volumes:
    # Left = folder on your laptop, right = path inside the container.
    # Edit a DAG in VS Code -> Airflow sees it within ~30 s. No rebuild.
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    # Day 4: code for the load/transform tasks, mounted READ-ONLY (:ro).
    - ./battery_dbt:/opt/airflow/battery_dbt:ro
    - ./load_raw.py:/opt/airflow/scripts/load_raw.py:ro
    - ./verify_backfill.py:/opt/airflow/scripts/verify_backfill.py:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow   # local-only metadata DB, never exposed
      POSTGRES_DB: airflow
    volumes:
      # Named volume: run history survives "docker compose down".
      # "docker compose down -v" wipes it (a break-it experiment later).
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  # ---- Day 3: our data warehouse ---------------------------------------------
  # dbt builds staging/marts here; Flask reads from here (Day 4).
  # Deliberately separate from Airflow's metadata DB ("postgres" above), so an
  # Airflow upgrade or reset can never touch our data.
  warehouse:
    image: postgres:16                  # pinned major version, same as Airflow's DB
    environment:
      # Values come from .env (never committed). ":?" makes compose stop with
      # this message if the variable is missing, instead of starting silently.
      POSTGRES_USER: ${WAREHOUSE_USER:?set WAREHOUSE_USER in .env}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:?set WAREHOUSE_PASSWORD in .env}
      POSTGRES_DB: ${WAREHOUSE_DB:-battery}
    ports:
      # host 127.0.0.1:5433 -> container 5432
      # 5433 because the Windows PostgreSQL service already uses 5432;
      # 127.0.0.1 so only this PC can connect, not the whole network.
      - "127.0.0.1:5433:5432"
    volumes:
      # Named volume: warehouse data survives container restarts/re-creation.
      - warehouse-db:/var/lib/postgresql/data
    healthcheck:
      # "$$" passes a literal "$" so the variables are read inside the container.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped             # same policy as the other services

  # ---- Day 4: read-only results API (D4.4) ------------------------------------
  # Own small image (Dockerfile.api); code baked in, NOT mounted: a deployable
  # artifact. Reads analytics_marts only, as read-only role api_reader.
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: battery-api:0.1.0
    environment:
      API_DB_HOST: warehouse            # Docker network name, not 127.0.0.1
      API_DB_PORT: "5432"               # container port, not 5433
      API_DB_NAME: ${WAREHOUSE_DB:-battery}
      API_DB_USER: api_reader
      API_DB_PASSWORD: ${API_READER_PASSWORD:?set API_READER_PASSWORD in .env}
    ports:
      # gunicorn listens on 0.0.0.0:8000 INSIDE the container; the host
      # publishes it on 127.0.0.1 only, so only this PC can reach it.
      - "127.0.0.1:5000:8000"
    depends_on:
      warehouse:
        condition: service_healthy
    healthcheck:
      # slim image has no curl: use Python. urlopen raises on 503 -> unhealthy.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins /opt/airflow/config
        exec /entrypoint airflow version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"          # create/upgrade metadata tables
      _AIRFLOW_WWW_USER_CREATE: "true"     # create the UI login
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    user: "0:0"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-db:
  warehouse-db: